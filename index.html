<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawgers Compliance Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a parody corporate learning portal. Navy top bar, module checklist rail, one lesson card at a time with the plush Dawg as facilitator. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f5f7f9; --ink:#1b2430; --muted:#5b6878; --line:#d5dbe3;
  --brand:#1f3a5f; --brand-ink:#ffffff; --accent:#c8781e; --good:#2f7d4f; --bad:#b4372f; --good-bg:#e5f3ea; --bad-bg:#fbe9e7;
  --dm:#313338; --dm2:#2b2d31; --dm-ink:#dbdee1; --dm-link:#4ea4ff;
  --f-head:"Source Serif 4",Georgia,serif; --f-body:"Public Sans",system-ui,-apple-system,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1a212b; --sunk:#151b23; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2d3846;
  --brand:#1b3354; --brand-ink:#ffffff; --accent:#e9963f; --good:#5cc489; --bad:#ff7a6e; --good-bg:#16301f; --bad-bg:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1a212b; --sunk:#151b23; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2d3846;
  --brand:#1b3354; --brand-ink:#ffffff; --accent:#e9963f; --good:#5cc489; --bad:#ff7a6e; --good-bg:#16301f; --bad-bg:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--brand);color:var(--brand-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.portal{font-weight:800;letter-spacing:.02em}
.portal small{display:block;font-weight:400;opacity:.75;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.who{margin-left:auto;font-size:13px;opacity:.9;text-align:right}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;width:140px;margin-top:4px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.main{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
.rail h3{margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mod{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.mod .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.mod.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mod.on .dot{border-color:var(--accent);color:var(--accent)}
.mod.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
h1,h2{font-family:var(--f-head);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px)} h2{font-size:24px}
p{margin:0;max-width:66ch}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.fac{display:flex;gap:14px;align-items:flex-end}
.fac img{height:84px;width:auto;flex:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.bubble{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:15px;min-width:0}
.bubble b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.callout{border-left:4px solid var(--accent);background:var(--sunk);padding:12px 16px;border-radius:0 8px 8px 0;max-width:66ch}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)} .callout.good{border-color:var(--good);background:var(--good-bg)}
.policy{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.tile h4{margin:0;font-size:15px}
.tile .do{color:var(--good);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tile .dont{color:var(--bad);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;margin-top:4px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 20px;background:var(--brand);color:var(--brand-ink);font-weight:800}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#1d1205}
.step{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;width:100%;max-width:420px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ack{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);max-width:66ch;cursor:pointer}
.ack input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
/* knowledge check */
.q{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:10px}
.q .qt{font-weight:800}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.fb{font-size:14px;min-height:0}
.fb.right{color:var(--good)} .fb.wrong{color:var(--bad)}
/* phishing email */
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
.mail .hd{background:var(--sunk);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.mail .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.flag{cursor:pointer;border-radius:4px;padding:0 2px;transition:background .15s}
.flag:hover{background:rgba(200,120,30,.15)}
.flag.found{background:var(--bad-bg);outline:2px solid var(--bad);color:var(--bad)}
.fake-link{color:var(--dm-link);text-decoration:underline}
/* the DM simulation */
.dm{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--dm);color:var(--dm-ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:50;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(30px);opacity:0}}
.dm .dh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--dm2);font-size:13px}
.dm .av{width:34px;height:34px;border-radius:50%;background:#6b5bd6;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.dm .x{margin-left:auto;background:none;border:0;color:var(--dm-ink);font-size:20px;line-height:1;padding:4px 8px;opacity:.7}
.dm .db{padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.dm .db a{color:var(--dm-link)}
.dm .embed{border-left:4px solid #6b5bd6;background:var(--dm2);border-radius:4px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.dm .embed b{color:#fff;font-size:14px}
.dm .acts{display:flex;gap:8px;padding:0 14px 14px}
.dm .acts button{flex:1;border:0;border-radius:6px;padding:9px;font-weight:700;font-size:13px}
.dm .rep{background:#da373c;color:#fff} .dm .ign{background:#4e5058;color:#fff}
.pwned{position:fixed;inset:0;z-index:60;background:#000;color:#ff4d4d;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--f-mono)}
.pwned div{max-width:520px;display:flex;flex-direction:column;gap:14px}
.pwned h2{font-family:var(--f-mono);font-size:26px;color:#ff4d4d}
.pwned p{color:#ffb3b3;margin:0 auto}
.pwned .btn{background:#ff4d4d;color:#000;align-self:center}
/* certificate */
.phishdog{display:block;height:48px;width:auto;margin-top:4px}
.nmrow{display:flex;align-items:flex-end;justify-content:center;gap:10px;border-bottom:1px solid var(--line);padding:0 12px 4px;max-width:100%}
.cert .nmrow .nm{border:0;padding:0;min-width:0;overflow-wrap:anywhere}
.certdog{height:clamp(56px,14vw,80px);width:auto;flex:none;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.cert{position:relative;border:3px double var(--brand);border-radius:6px;padding:30px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.cert .nm{font-family:var(--f-head);font-size:clamp(28px,6vw,40px);font-weight:700;border-bottom:1px solid var(--line);padding:0 20px 4px}
.cert table{border-collapse:collapse;font-size:14px;margin-top:6px}
.cert td{padding:4px 10px;text-align:left;border-bottom:1px solid var(--line)}
.cert td:first-child{color:var(--muted)}
.cert .id{font-family:var(--f-mono);font-size:18px;letter-spacing:.12em;padding:8px 14px;border:1px dashed var(--accent);border-radius:6px}
.seal{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#1d1205;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.08em;line-height:1.2;text-transform:uppercase;box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
.certacts{display:flex;gap:10px;flex-wrap:wrap}.certacts .btn{flex:1 1 180px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-bottom:20px}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px}
  .rail h3{display:none}
  .mod{flex:none;padding:6px 8px}
  .mod span:last-child{display:none}
  .mod.on span:last-child{display:inline}
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){.dm{animation:none}}
</style>

</head>

</div></header>
<div class="main">
  <nav class="rail" id="rail" aria-label="Course modules"></nav>
  <main class="card" id="card"></main>
</div>
<div class="foot">Course DWG-101 &middot; Rev. 2026.10 &middot; This training is mandatory for anyone holding the Dawg role. Guests are welcome to attend.</div>

let dmTimer = null;

const TOTALQ = Object.values(CHECKS).reduce((n, a) => n + a.length, 0);
const firstRight = () => Object.values(st.first).filter(v => v === true).length;

/* ---------- render ---------- */
function render(){
  const s = SLIDES[st.at];

  $("rail").innerHTML = `<h3>Course outline</h3>` + MODULES.map((m, k) => `<div class="mod ${k === mi ? "on" : ""} ${k < mi || (st.done && k <= mi) ? "done" : ""}"><span class="dot">${k < mi ? "&#10003;" : k + 1}</span><span>${esc(m.name)}</span></div>`).join("");
  $("who").textContent = st.name ? st.name : "Not signed in";
  $("pbar").style.width = Math.round(st.at / (SLIDES.length - 1) * 100) + "%";
  clearTimeout(dmTimer);
  if (s.cert) return cert();
  const body = s.check ? checkHtml(s.check) : s.html();
  const fac = s.check ? { stk: "note", say: "Knowledge check. Answer each one correctly to continue. Not timed. Take your time." } : s;
  $("card").innerHTML = `
    <div class="fac"><img id="dog" src="${STK[fac.stk] || STK.teach}" alt="The facilitator, a plush dog. Do not touch."><div class="bubble" id="sb"><b>Your facilitator</b><span>${esc(fac.say)}</span></div></div>
    ${body}
    <div class="nav">
      <button class="btn ghost" id="back" ${st.at === 0 ? "disabled" : ""}>Back</button>
      <span class="step">Page ${st.at + 1} of ${SLIDES.length}</span>
      <button class="btn" id="next">Next</button>
    </div>`;
  if (s.after) s.after();
  if (s.check) bindCheck(s.check);
  $("back").onclick = () => { st.at--; save(); render(); scrollTo(0, 0); };
  $("next").onclick = () => { if (!canGo()) return; st.at++; save(); render(); scrollTo(0, 0); };
  $("dog").onclick = touchDog;
  gateCheck();
  const dmAt = SLIDES.findIndex(x => x.id === DM_SLIDE), simAt = SLIDES.findIndex(x => x.id === "m3-sim");
  if (!st.dm && st.at >= dmAt && st.at < simAt && !$("dml")) dmTimer = setTimeout(showDM, st.at === dmAt ? DM_DELAY : 1500);
}
function canGo(){
  const s = SLIDES[st.at];
  if (s.gate) return s.gate();
  if (s.check) return CHECKS[s.check].every((_, k) => st.tries[s.check + k] && st.tries[s.check + k].solved);
  return true;
}
function gateCheck(){ const n = $("next"); if (n) n.disabled = !canGo(); }

/* ---------- the dog ---------- */
const DOG = ["Please don't touch me.", "I said please don't touch me.", "This is being logged.", "HR has been notified.", "Do you not understand Dawg?", "Every touch goes on your certificate.", "Hands. Off.", "I'm filing a formal complaint."];

/* ---------- knowledge checks ---------- */
function checkHtml(mod){
  const mi = MODULES.findIndex(m => m.id === mod);
  return `<div class="eyebrow">Module ${mi + 1} &middot; Knowledge check</div><h2>${esc(MODULES[mi].name)}: knowledge check</h2>` +
    CHECKS[mod].map((c, k) => `<div class="q" data-q="${k}"><div class="qt">${k + 1}. ${esc(c.q)}</div>${orderFor(mod, k).map(o => `<button class="opt" data-o="${o}">${esc(c.o[o])}</button>`).join("")}<div class="fb" id="fb-${mod}${k}"></div></div>`).join("");
}
function orderFor(mod, k){
  // shuffle once per person so the right answer isn't always first
  const key = mod + k; st.ord = st.ord || {};
  if (!st.ord[key]) { const n = CHECKS[mod][k].o.length; st.ord[key] = [...Array(n).keys()].sort(() => Math.random() - .5); save(); }
  return st.ord[key];
}
function bindCheck(mod){
  CHECKS[mod].forEach((c, k) => {
    const key = mod + k, box = document.querySelector(`.q[data-q="${k}"]`), fb = $("fb-" + key);
    const t = st.tries[key] = st.tries[key] || { wrong: [], solved: false };
    const paint = () => {
      box.querySelectorAll(".opt").forEach(b => {
        const o = +b.dataset.o;
        b.classList.toggle("wrong", t.wrong.includes(o));
        b.classList.toggle("right", t.solved && o === c.a);
        b.disabled = t.solved || t.wrong.includes(o);
      });
      if (t.solved) { fb.className = "fb right"; fb.textContent = c.why; }
    };
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = +b.dataset.o;
      if (!(key in st.first)) st.first[key] = o === c.a;
      if (o === c.a) t.solved = true;
      else { t.wrong.push(o); fb.className = "fb wrong"; fb.textContent = pick(["Incorrect. Please review the material and try again.", "That is not consistent with Dawgers policy. Try again.", "Incorrect. HR is disappointed but supportive.", "Incorrect. This has been noted."]); }
      save(); paint(); gateCheck();
    });
    paint();
  });
}

function simReveal(){

  if (r === "clicked") return head + what + `<div class="callout bad"><b>Result: you clicked the link.</b> In real life, your Discord account would now belong to someone else and be sending this same message to all of your friends. This result will appear on your certificate.</div>`;

}

/* ---------- certificate ---------- */
function certId(){
  const s = [st.name.trim().toLowerCase(), firstRight(), st.dm || "none", st.touches || 0, SECRET].join("|");
  let h = 2166136261;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  return "DWG-" + h.toString(36).toUpperCase().padStart(7, "0").slice(-6);
}
// the Dawg next to the name depends on first-try score; which one in the tier is fixed per name
const CERT_DOGS = [
  { min: .9, dogs: ["party", "heart", "rose"] },
  { min: .7, dogs: ["thumbs", "hat", "yes", "scarf"] },
  { min: .4, dogs: ["look", "bow", "squint", "think"] },
  { min: .2, dogs: ["cry", "wail", "unimpressed", "annoyed"] },
  { min: 0,  dogs: ["toilet", "floor", "ragged", "torn"] }
];
const PHISH_DOG = "panic";   // extra Dawg beside a failed phishing simulation
function certDogFor(){
  const f = firstRight() / TOTALQ, tier = CERT_DOGS.find(t => f >= t.min) || CERT_DOGS[CERT_DOGS.length - 1];
  let h = 0; for (const ch of (st.name || "").toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return tier.dogs[h % tier.dogs.length];
}
const DM_LABEL = { clicked: "FAILED (clicked the link)", reported: "Passed (reported it)", ignored: "Passed (ignored it)", none: "Not received" };
function cert(){

  if (!st.done) { st.done = true; st.date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); save(); }

  $("card").innerHTML = `

    <div class="cert">
      <div class="seal">Human<br>Resources<br>Approved</div>

      <div>This certifies that</div>
      <div class="nmrow"><div class="nm">${esc(st.name)}</div><img class="certdog" id="certdog" src="${STK[st.certDog]}" alt="A Dawg reacting to your score"></div>${st.pronouns ? `<div class="policy">(${esc(st.pronouns)})</div>` : ""}
      <div>has completed <b>DWG-101: Annual Inclusivity &amp; Information Security Training</b></div>
      <table>
        <tr><td>Completed</td><td>${esc(st.date || "")}</td></tr>

        <tr><td>Dog touching incidents</td><td style="color:${touches ? "var(--bad)" : "var(--ink)"}">${touches}${touches >= 5 ? " (referred to HR)" : ""}</td></tr>
      </table>
      <div class="id">${certId()}</div>

    </div>
    <div class="certacts"><button class="btn" id="csave">Save certificate</button><button class="btn warm" id="ccopy">Copy certificate</button></div>
    <div class="fb" id="cmsg" role="status"></div>
    <p>Save or copy your certificate and post it in the server. Copy puts the image on your clipboard so you can paste it straight into Discord. The certificate ID proves it's real.</p>

      }

      msg("Certificate saved. Check your downloads.", true);
    } catch (e) { msg("Couldn't save the image here. Take a screenshot instead.", false); }
  };
  $("ccopy").onclick = async () => {
    try {

      try { await navigator.clipboard.writeText(certText()); msg("Your browser won't copy images, so the certificate was copied as text instead.", true); }

    }
  };
}

    "Knowledge checks, first try: " + firstRight() + " of " + TOTALQ, "Phishing simulation: " + DM_LABEL[st.dm || "none"],
    "Dog touching incidents: " + (st.touches || 0), "Certificate ID: " + certId()].join("\n");

// draws the certificate as a PNG (paper colours, same in light and dark mode)
async function certBlob(){

  const W = 1000, H = 1180, c = document.createElement("canvas"), x = c.getContext("2d");
  c.width = W; c.height = H;
  const navy = "#1f3a5f", ink = "#1b2430", muted = "#5b6878", line = "#d5dbe3", amber = "#c8781e", bad = "#b4372f";
  const serif = '"Source Serif 4", Georgia, serif', sans = '"Public Sans", system-ui, sans-serif', mono = '"IBM Plex Mono", ui-monospace, monospace';
  x.fillStyle = "#fbfaf6"; x.fillRect(0, 0, W, H);
  x.strokeStyle = navy; x.lineWidth = 6; x.strokeRect(24, 24, W - 48, H - 48); x.lineWidth = 2; x.strokeRect(38, 38, W - 76, H - 76);
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  const t = (s, y, font, col) => { x.font = font; x.fillStyle = col; x.fillText(s, W / 2, y); };
  const wrap = (s, y, font, col, max, lh) => { x.font = font; const words = s.split(" "); let cur = "", out = []; words.forEach(w => { const tr = cur ? cur + " " + w : w; if (x.measureText(tr).width > max && cur) { out.push(cur); cur = w; } else cur = tr; }); out.push(cur); out.forEach((l, k) => t(l, y + k * lh, font, col)); return y + (out.length - 1) * lh; };
  // seal
  x.beginPath(); x.arc(W / 2, 150, 70, 0, Math.PI * 2); x.fillStyle = amber; x.fill();
  x.beginPath(); x.arc(W / 2, 150, 80, 0, Math.PI * 2); x.strokeStyle = amber; x.lineWidth = 3; x.stroke();
  ["HUMAN", "RESOURCES", "APPROVED"].forEach((w, k) => t(w, 132 + k * 22, "800 17px " + sans, "#1d1205"));
  // facilitator sticker in the corner
  t("CERTIFICATE OF COMPLETION", 280, "800 22px " + sans, amber);
  t("This certifies that", 340, "400 24px " + sans, ink);
  // name with the random Dawg beside it
  const im = $("certdog"), ok = im && im.complete && im.naturalWidth, dh = 96, dw = ok ? im.naturalWidth * dh / im.naturalHeight : 0, gap = ok ? 18 : 0;
  let y = 450; x.font = "700 60px " + serif; let size = 60; while (x.measureText(st.name).width + dw + gap > W - 200 && size > 30) { size -= 2; x.font = "700 " + size + "px " + serif; }
  const tw = x.measureText(st.name).width, gx = (W - tw - gap - dw) / 2;
  x.textAlign = "left"; x.fillStyle = ink; x.fillText(st.name, gx, y); x.textAlign = "center";
  if (ok) x.drawImage(im, gx + tw + gap, y + 14 - dh, dw, dh);
  x.strokeStyle = line; x.lineWidth = 2; x.beginPath(); x.moveTo(Math.min(220, gx - 20), y + 22); x.lineTo(Math.max(W - 220, gx + tw + gap + dw + 20), y + 22); x.stroke();
  if (st.pronouns) t("(" + st.pronouns + ")", y + 58, "500 20px " + mono, muted);
  y = wrap("has completed DWG-101: Annual Inclusivity & Information Security Training", y + 112, "700 26px " + sans, ink, W - 220, 36);
  const rows = [["Completed", st.date || "", ink], ["Knowledge checks, first try", firstRight() + " of " + TOTALQ + " (" + Math.round(firstRight() / TOTALQ * 100) + "%)", ink],
    ["Phishing simulation", DM_LABEL[st.dm || "none"], st.dm === "clicked" ? bad : ink], ["Dog touching incidents", String(st.touches || 0) + ((st.touches || 0) >= 5 ? " (referred to HR)" : ""), (st.touches || 0) ? bad : ink]];
  y += 70; x.textAlign = "left";
  rows.forEach(([k, v, col]) => {
    x.font = "400 22px " + sans; x.fillStyle = muted; x.fillText(k, 170, y);
    x.font = (col === bad ? "800 " : "500 ") + "22px " + sans; x.fillStyle = col; x.fillText(v, 520, y);
    if (k === "Phishing simulation" && st.dm === "clicked") { const pd = $("phishdog"); if (pd && pd.complete && pd.naturalWidth) { const ph = 64, pw = pd.naturalWidth * ph / pd.naturalHeight; x.drawImage(pd, Math.min(520 + x.measureText(v).width + 12, W - 70 - pw), y - 46, pw, ph); } }
    x.strokeStyle = line; x.beginPath(); x.moveTo(160, y + 18); x.lineTo(W - 160, y + 18); x.stroke();
    y += 58;
  });
  x.textAlign = "center"; y += 50;
  x.font = "500 34px " + mono; const id = certId(), iw = x.measureText(id).width + 60;
  x.setLineDash([8, 6]); x.strokeStyle = amber; x.lineWidth = 2; x.strokeRect(W / 2 - iw / 2, y - 44, iw, 64); x.setLineDash([]);
  t(id, y, "500 34px " + mono, ink);
  t("Certificate ID", y + 52, "500 16px " + mono, muted);
  t("Dawgers Learning Portal \u00b7 Department of Human Resources", H - 64, "400 16px " + sans, muted);
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("no image")), "image/png"));
}

/* ---------- verify page for Dym: open the page with #verify ---------- */
function verify(){
  $("rail").innerHTML = "";
  $("card").innerHTML = `
    <div class="eyebrow">HR only</div>
    <h2>Verify a certificate</h2>
    <p>Copy the details from someone's certificate screenshot.</p>
    <input type="text" id="vn" placeholder="Name exactly as on the certificate" autocomplete="off">
    <input type="text" id="vs" inputmode="numeric" placeholder="First-try score (the first number)" autocomplete="off">
    <label for="vd">Phishing simulation</label>
    <select id="vd" style="font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:420px">
      <option value="reported">Passed (reported it)</option><option value="ignored">Passed (ignored it)</option><option value="clicked">FAILED (clicked the link)</option><option value="none">Not received</option>
    </select>
    <input type="text" id="vt" inputmode="numeric" placeholder="Dog touching incidents" autocomplete="off">
    <input type="text" id="vc" placeholder="Certificate ID, like DWG-XXXXXX" autocomplete="off">
    <button class="btn" id="vgo" style="align-self:flex-start">Verify</button>
    <div id="vr"></div>`;
  $("vgo").onclick = () => {
    const keep = { ...st };
    st = { ...st, name: $("vn").value, dm: $("vd").value === "none" ? null : $("vd").value, touches: parseInt($("vt").value || "0", 10) || 0 };
    const target = parseInt($("vs").value, 10);
    const s = [st.name.trim().toLowerCase(), target, st.dm || "none", st.touches, SECRET].join("|");
    let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
    const ok = "DWG-" + h.toString(36).toUpperCase().padStart(7, "0").slice(-6) === $("vc").value.trim().toUpperCase();
    st = keep;
    $("vr").innerHTML = ok ? `<div class="callout good"><b>Legit.</b> This certificate is real.</div>` : `<div class="callout bad"><b>Doesn't match.</b> Check the name spelling, the numbers and the phishing result.</div>`;
  };
}

if (location.hash === "#verify") verify(); else render();
addEventListener("hashchange", () => location.hash === "#verify" ? verify() : render());
